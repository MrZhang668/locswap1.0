# nginx in front of LocSwap: serves the built frontend, proxies the API.
#
# Replace locswap.example.com with the real hostname before the TLS block is
# worth uncommenting.

# Compression. The stock nginx image ships with gzip off, so the ~900 KB app
# bundle went out uncompressed on every first visit — the largest single item in
# both the page load (slow over the cross-border link from the mainland) and the
# per-GB traffic bill. Images and tiles are already compressed; not listed here.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# Rate limits, priced by what the endpoint actually costs.
#
# One limit across all of /api/ was the first attempt and it was wrong: almost
# everything under /api/ — browsing, paging, opening a listing, the click
# counter — is local SQL and costs nothing, so a shared 30r/m throttled ordinary
# use. Measured: 14 requests in and the acceptance suite was getting 503s, which
# is roughly what one person clicking around produces.
#
# So three zones. `browse` is generous because those requests are cheap and a
# single page view makes several. `ai` is tight because every one of those calls
# reaches a language model and a vector store, and the bill is per request.
# `auth` is tight because it is the endpoint worth guessing at.
limit_req_zone $binary_remote_addr zone=browse:10m rate=240r/m;
limit_req_zone $binary_remote_addr zone=ai:10m     rate=20r/m;
limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
# Map tiles: one pan or zoom pulls 20-40 at once, so this is per-second, not
# per-minute. It exists to stop the proxy below being used as a free tile
# server, not to throttle anyone looking at the campus map.
limit_req_zone $binary_remote_addr zone=tiles:10m  rate=20r/s;

# OpenStreetMap tiles, proxied and cached here. Visitors in mainland China often
# cannot load tile.openstreetmap.org directly; this server they can reach. The
# map is pinned to one campus, so a few thousand tiles cover everything anyone
# will ever see and almost every request after the first day is a cache hit —
# which is also what OSM's tile usage policy asks of a proxy.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tile_cache:10m
                 max_size=1g inactive=60d use_temp_path=off;

# ---------------------------------------------------------------------------
# Servers. https://locswap.cn is the one canonical address; every other way of
# reaching this machine — plain HTTP, www., the bare IP — is redirected there,
# so a session token is never sent in the clear and there is one origin for
# CORS_ORIGINS to name.
#
# The certificate (Let's Encrypt, locswap.cn + www.locswap.cn) was issued by
# deploy/enable-https.sh and is renewed daily by /etc/cron.d/locswap-certbot on
# the server. nginx will not start if these certificate paths do not exist —
# on a fresh server, run enable-https.sh with the previous (HTTP-only) config
# first. See deploy/README.md.
# ---------------------------------------------------------------------------

# Plain HTTP: certificate challenges, and a redirect for everything else.
server {
    listen 80 default_server;
    server_name _;

    # Renewal answers its challenge here; it must not be redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://locswap.cn$request_uri;
    }
}

ssl_certificate     /etc/nginx/certs/live/locswap.cn/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/live/locswap.cn/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# The site.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name locswap.cn;

    # No includeSubDomains: nothing else lives under this domain yet, and the
    # flag cannot be taken back for a year once browsers have seen it.
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/conf.d/locswap-locations.inc;
}

# www. -> the bare domain, over HTTPS (the certificate covers both names).
server {
    listen 443 ssl;
    http2 on;
    server_name www.locswap.cn;
    return 301 https://locswap.cn$request_uri;
}
